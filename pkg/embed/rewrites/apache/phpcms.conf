RewriteEngine On
RewriteBase /
RewriteRule ^(.*)show-([0-9]+)-([0-9]+)\.html$ $1/show.php?itemid=$2&page=$3 [QSA,L]
RewriteRule ^(.*)list-([0-9]+)-([0-9]+)\.html$ $1/list.php?catid=$2&page=$3 [QSA,L]
RewriteRule ^(.*)show-([0-9]+)\.html$ $1/show.php?specialid=$2 [QSA,L]
RewriteRule ^(.*)-htm-(.*)$ $1.php?$2 [QSA,L]
RewriteRule ^(.*/)?simple/([a-z0-9\_]+\.html)$ $1simple/index.php?$2 [QSA,L]
