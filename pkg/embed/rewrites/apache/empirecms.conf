RewriteEngine On
RewriteBase /
RewriteRule ^([^.]*/)?listinfo-(.+?)-(.+?)\.html$ $1e/action/ListInfo/index.php?classid=$2&page=$3 [QSA,L]
RewriteRule ^([^.]*/)?showinfo-(.+?)-(.+?)-(.+?)\.html$ $1e/action/ShowInfo.php?classid=$2&id=$3&page=$4 [QSA,L]
RewriteRule ^([^.]*/)?infotype-(.+?)-(.+?)\.html$ $1e/action/InfoType/index.php?ttid=$2&page=$3 [QSA,L]
RewriteRule ^([^.]*/)?tags-(.+?)-(.+?)\.html$ $1e/tags/index.php?tagname=$2&page=$3 [QSA,L]
RewriteRule ^([^.]*/)?comment-(.+?)-(.+?)-(.+?)-(.+?)-(.+?)-(.+?)\.html$ $1e/pl/index.php?doaction=$2&classid=$3&id=$4&page=$5&myorder=$6&tempid=$7 [QSA,L]
