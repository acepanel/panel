name: Mockery
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  mockery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: true
          go-version-file: go.mod
      - name: Generate Mocks
        run: go run github.com/vektra/mockery/v3@v3.9.0
      - name: Verify mocks are up to date
        run: |
          git add -N .
          git diff --exit-code
